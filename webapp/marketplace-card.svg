<svg xmlns="http://www.w3.org/2000/svg" width="965" height="482" viewBox="0 0 965 482">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1033"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#a78bfa" fill-opacity=".16"/>
    </pattern>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="965" height="482" fill="url(#bg)"/>
  <rect width="965" height="482" fill="url(#dots)"/>
  <rect width="965" height="482" fill="url(#glowV)"/>
  <rect width="965" height="482" fill="url(#glowC)"/>
  <!-- the skylls bars, large and faint on the right so text on the left stays readable -->
  <g opacity=".22" transform="translate(640 96)">
    <rect x="0" y="0" width="250" height="62" rx="31" fill="url(#violet)"/>
    <rect x="0" y="94" width="250" height="62" rx="31" fill="url(#cyan)"/>
    <rect x="0" y="188" width="160" height="62" rx="31" fill="url(#violet)"/>
  </g>
</svg>
