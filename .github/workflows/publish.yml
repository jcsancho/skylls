# Publishes @skylls/cli to npm when a version tag (v1.2.3) is pushed.
# npm trusted publishing (OIDC): no npm token; the package's Trusted Publisher on npmjs.com
# must name this repo and this file (publish.yml).
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.19.0)"
        required: true

permissions:
  contents: read
  id-token: write  # lets npm verify this run (trusted publishing + provenance)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Tag matches both versions
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PYV=$(python3 -c "import skylls; print(skylls.__version__)")
          NPMV=$(node -p "require('./package.json').version")
          echo "tag $TAG, __version__ $PYV, package.json $NPMV"
          [ "$TAG" = "v$PYV" ] && [ "$TAG" = "v$NPMV" ] || { echo "::error::tag and versions differ"; exit 1; }

      - name: Already on npm?
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@skylls/cli@$V" version >/dev/null 2>&1; then
            echo "::notice::@skylls/cli $V is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 -m skylls --version
          node bin/skylls.js --version
          python3 -m skylls help > /dev/null

      - name: End-to-end test (sandbox, fake GitHub)
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          bash tests/e2e.sh

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
          npm publish --provenance --access public
